:root {
  --bg: #eef1f5;
  --bg-image:
    radial-gradient(900px 520px at 8% -10%, rgba(186, 214, 245, 0.9), rgba(186, 214, 245, 0) 70%),
    radial-gradient(780px 480px at 100% 0%, rgba(198, 230, 206, 0.85), rgba(198, 230, 206, 0) 68%),
    radial-gradient(720px 460px at 78% 100%, rgba(255, 214, 186, 0.8), rgba(255, 214, 186, 0) 70%),
    radial-gradient(640px 420px at 0% 85%, rgba(210, 226, 248, 0.7), rgba(210, 226, 248, 0) 72%);
  --surface-2: #f4f5f7;
  --card: rgba(255, 255, 255, 0.62);
  --glass: rgba(255, 255, 255, 0.55);
  --glass-solid: rgba(255, 255, 255, 0.92);
  /* Palette, radii and shadow of the Agenda do André (vps/public/index.html). */
  --ink: #0d223b;
  --ink-soft: #1a395c;
  --accent: #1b477a;
  --accent-bright: #2d6eb8;
  --verde: #1b7a55;
  --accent-glow: rgba(27, 71, 122, 0.14);
  --on-accent: #ffffff;
  --text: #121920;
  --muted: #5a636e;
  --border: #c8d0d9;
  --today-bg: rgba(27, 71, 122, 0.12);
  --other-month: #9aa3ad;
  --danger: #a02a1f;
  --danger-soft: #fee2e2;
  --warn: #b45309;
  --shadow: 0 4px 24px rgba(13, 34, 59, 0.12);
  --radius: 22px;
  --radius-sm: 12px;
  /* LEDs of the Agenda do André (vps/public/index.html, "seta-pontos"): 5 px dots, 2 px apart;
     red, green, yellow, blue and light gray are its colors. It has no orange or dark gray LED. */
  --dot-size: 5px;
  --dot-gap: 2px;
  --dot-red: #c0392b;
  --dot-green: #2db87a;
  --dot-yellow: #eab308;
  --dot-orange: #ea580c;
  --dot-blue: #2d6eb8;
  --dot-gray: #98a2ad;
  --dot-cancel: #374151;
  color-scheme: light;
}

/* Creme: the Agenda do André's "dark" theme is a light beige one (vidro-liquido.css), with its own
   gray, border, surface, today and shadow (vps/public/index.html); the rest stays as in the light theme. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #f6eedd;
    --bg-image:
      radial-gradient(900px 520px at 12% -8%, rgba(244, 196, 154, 0.75), rgba(244, 196, 154, 0) 70%),
      radial-gradient(760px 480px at 100% 8%, rgba(190, 214, 186, 0.7), rgba(190, 214, 186, 0) 68%),
      radial-gradient(700px 440px at 70% 100%, rgba(186, 210, 232, 0.65), rgba(186, 210, 232, 0) 70%);
    --card: rgba(255, 252, 244, 0.62);
    --glass: rgba(255, 252, 244, 0.55);
    --glass-solid: rgba(255, 252, 244, 0.92);
    --muted: #505862;
    --border: #d3c5ab;
    --surface-2: #f6eedd;
    --today-bg: #dfe7f1;
    --shadow: 0 4px 24px rgba(90, 66, 20, 0.12);
  }
}

:root[data-theme="dark"] {
  --bg: #f6eedd;
  --bg-image:
    radial-gradient(900px 520px at 12% -8%, rgba(244, 196, 154, 0.75), rgba(244, 196, 154, 0) 70%),
    radial-gradient(760px 480px at 100% 8%, rgba(190, 214, 186, 0.7), rgba(190, 214, 186, 0) 68%),
    radial-gradient(700px 440px at 70% 100%, rgba(186, 210, 232, 0.65), rgba(186, 210, 232, 0) 70%);
  --card: rgba(255, 252, 244, 0.62);
  --glass: rgba(255, 252, 244, 0.55);
  --glass-solid: rgba(255, 252, 244, 0.92);
  --muted: #505862;
  --border: #d3c5ab;
  --surface-2: #f6eedd;
  --today-bg: #dfe7f1;
  --shadow: 0 4px 24px rgba(90, 66, 20, 0.12);
}

/* Comfortable base size for all-day use; a step larger on big screens. */
html { font-size: 16px; }
@media (min-width: 1680px) { html { font-size: 17px; } }
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Google Sans Flex', 'Google Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); background-image: var(--bg-image); background-repeat: no-repeat; background-attachment: fixed; color: var(--text); line-height: 1.45; overflow-x: hidden; }
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); font-size: 0.82rem; }
.num, .table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.text-danger { color: var(--danger); }
.spacer { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 22px; }
.stack > .btn { align-self: flex-start; }

/* —— Header and tabs (top chrome, as in the Agenda Digital) —— */
.app { width: 100%; margin: 0; padding: 16px clamp(12px, 1.6vw, 28px) 48px; }
.header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.header-brand h1 { font-size: 1.35rem; font-weight: 700; color: var(--ink); }
.header-sub { font-size: 0.8rem; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.header-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.backup-pill { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-weight: 600; font-size: 0.8rem; cursor: pointer; }
.backup-pill--reautorizar { border-color: var(--dot-orange); }
.backup-pill--erro { border-color: var(--dot-red); color: var(--danger); }
.cloud-pill--sem-acesso, .cloud-pill--erro { border-color: var(--dot-red); color: var(--danger); }
.cloud-pill--offline { border-color: var(--dot-orange); }
/* Before sign-in only the sign-in card shows: no records, no notebook. */
.cloud-locked #toolbar, .cloud-locked #side, .cloud-locked .tabs { display: none; }
body.cloud-locked .shell, body.cloud-locked.side-open .shell { grid-template-columns: minmax(0, 1fr); }
.signin { display: grid; place-items: center; min-height: 60vh; padding: 24px 0; }
.signin__card { max-width: 560px; text-align: center; padding: 36px 28px; }
.signin__title { font-size: 1.7rem; font-weight: 700; margin-bottom: 14px; }
.signin__text { font-size: 1.15rem; line-height: 1.55; margin-bottom: 26px; }
.btn.signin__button { font-size: 1.25rem; padding: 16px 34px; }
.signin__detail { margin-top: 18px; font-size: 0.9rem; overflow-wrap: anywhere; }
#backupBanner .banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 12px 0 0; }
.backup-status { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 0.88rem; }
.stack--tight { gap: 8px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 18px; scrollbar-width: thin; }
.tab { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-weight: 600; font-size: 0.88rem; cursor: pointer; white-space: nowrap; }
.tab:hover { background: var(--today-bg); }
.tab.is-active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* —— Page and cards —— */
.page-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.page-title { font-size: 1.5rem; font-weight: 700; }
.page-subtitle { color: var(--muted); margin-top: 2px; font-size: 0.9rem; }
.page-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.section-head .card-title { margin: 0; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
.card--flush { padding: 0; overflow: hidden; }
.card-title { font-size: 1.08rem; font-weight: 700; margin-bottom: 12px; }
.card h4 { font-size: 0.92rem; margin: 18px 0 6px; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 14px; }
.kpi { border-left: 6px solid var(--accent); }
.kpi--success { border-left-color: var(--dot-blue); }
.kpi--danger { border-left-color: var(--dot-yellow); }
.kpi--warning { border-left-color: var(--dot-orange); }
.kpi--forecast { border-left-color: var(--dot-green); }
.kpi__label { color: var(--muted); font-weight: 500; font-size: 0.88rem; }
.kpi__value { font-size: clamp(1.3rem, 2vw, 1.75rem); font-weight: 700; margin: 2px 0; overflow-wrap: anywhere; }
.kpi__detail { font-size: 0.78rem; color: var(--muted); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(22rem, 100%), 1fr)); gap: 18px; }
.empty { padding: 18px; text-align: center; color: var(--muted); }
.banner { padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 14px; font-weight: 500; }
.banner--danger { background: var(--danger-soft); color: var(--danger); }
.banner--warn { background: color-mix(in srgb, var(--dot-yellow) 14%, var(--card)); color: var(--text); border: 1px solid color-mix(in srgb, var(--dot-yellow) 45%, transparent); }
.info-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 12px; margin: 0; }
.info-list dt { font-size: 0.78rem; color: var(--muted); }
.info-list dd { margin: 0; font-weight: 500; }

/* —— Geometric LED signals (same spec as the Agenda Digital) —— */
.dot-signals { display: inline-flex; align-items: center; gap: 5px; vertical-align: middle; flex-shrink: 0; }
.dot-signal { display: inline-flex; align-items: center; gap: var(--dot-gap); flex-shrink: 0; }
.geo-dot { display: inline-block; width: var(--dot-size); height: var(--dot-size); min-width: var(--dot-size); border-radius: 50%; flex-shrink: 0; background: currentColor; }
.dot-signal--red { color: var(--dot-red); }
.dot-signal--orange { color: var(--dot-orange); }
.dot-signal--green { color: var(--dot-green); }
.dot-signal--yellow { color: var(--dot-yellow); }
.dot-signal--blue { color: var(--dot-blue); }
.dot-signal--gray { color: var(--dot-gray); }
.dot-signal--cancel { color: var(--dot-cancel); }
/* Every LED blinks like a lamp (the Agenda's "piscada orgânica", with a longer fade): it lights up
   fast (ease-out, 11% of the cycle), stays lit until 40%, fades slowly (ease-in-out, until 75%) and
   rests dark (opacity 0.1, as in the Agenda's pontoNatural). The dots of a signal light up from left
   to right, one step apart, and go out in the same order (the Agenda's seta-pontos: 24 ms in 800 ms).
   Alerts (red, orange, green) blink every 800 ms, as in the Agenda; the calm colors every 1.6 s.
   Green and the calm colors glow stronger: the halo and saturation of the Agenda's "luz de freio",
   without its brightness(1.28), which washes the gray out on the light background. */
@keyframes led {
  0% { opacity: 0.1; box-shadow: 0 0 0 0 transparent; animation-timing-function: ease-out; }
  11% { opacity: 1; box-shadow: 0 0 4px 1px currentColor; }
  40% { opacity: 1; box-shadow: 0 0 4px 1px currentColor; animation-timing-function: ease-in-out; }
  75%, 100% { opacity: 0.1; box-shadow: 0 0 0 0 transparent; }
}
@keyframes led-forte {
  0% { opacity: 0.1; box-shadow: 0 0 0 0 transparent; filter: none; animation-timing-function: ease-out; }
  11% { opacity: 1; box-shadow: 0 0 5px 1px currentColor; filter: saturate(1.45); }
  40% { opacity: 1; box-shadow: 0 0 5px 1px currentColor; filter: saturate(1.45); animation-timing-function: ease-in-out; }
  75%, 100% { opacity: 0.1; box-shadow: 0 0 0 0 transparent; filter: none; }
}
.dot-signal { --led-cycle: 1.6s; --led-step: 48ms; }
:is(.dot-signal--red, .dot-signal--orange, .dot-signal--green) { --led-cycle: 800ms; --led-step: 24ms; }
.dot-signal .geo-dot { animation-name: led-forte; animation-duration: var(--led-cycle); animation-iteration-count: infinite; animation-fill-mode: backwards; }
:is(.dot-signal--red, .dot-signal--orange) .geo-dot { animation-name: led; }
.dot-signal .geo-dot:nth-child(2) { animation-delay: var(--led-step); }
.dot-signal .geo-dot:nth-child(3) { animation-delay: calc(var(--led-step) * 2); }
/* Like the Agenda Digital, LEDs respect the system's "reduce motion"; the user may ask the
   app to keep them blinking anyway (Configurações › Aparência sets data-leds="sempre"). */
@media (prefers-reduced-motion: reduce) {
  :root:not([data-leds="sempre"]) .dot-signal .geo-dot { animation: none !important; opacity: 1; }
}
.signal-label { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 10px 14px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.8rem; color: var(--muted); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.agenda-legend { margin-bottom: 12px; }

/* —— Agenda toolbar —— */
.agenda-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; background: var(--card); padding: 3px; }
.segmented button { border: none; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
.segmented button.is-active { background: var(--accent); color: var(--on-accent); }
.nav-period { display: flex; align-items: center; gap: 8px; flex: 1 1 18rem; justify-content: center; }
.nav-period__label { font-weight: 700; font-size: 1.05rem; text-align: center; min-width: 14rem; }
.btn-icon { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); font-size: 1.2rem; cursor: pointer; }

/* —— Month grid —— */
.cal-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.weekday-row, .days-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.weekday-row { background: var(--ink); color: #fff; border-bottom: 1px solid var(--border); }
.weekday { text-align: center; font-size: 0.72rem; font-weight: 600; padding: 8px 2px; letter-spacing: 0.04em; text-transform: uppercase; }
.day-cell { min-height: 7.2rem; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 6px; background: var(--card); display: flex; flex-direction: column; gap: 3px; cursor: pointer; text-align: left; border-top: none; border-left: none; }
.day-cell:nth-child(7n) { border-right: none; }
.day-cell:hover { background: var(--today-bg); }
.day-cell.other-month { background: color-mix(in srgb, var(--bg) 70%, var(--card)); color: var(--other-month); }
.day-cell.today { background: var(--today-bg); box-shadow: inset 0 0 0 2px var(--accent); }
.day-head { display: flex; align-items: center; gap: 5px; width: 100%; min-height: 1.25rem; }
.day-head .day-signal { margin-left: auto; flex-shrink: 0; }
.day-cell.holiday { background: color-mix(in srgb, var(--dot-red) 5%, var(--card)); }
.day-tags { display: flex; flex-wrap: wrap; gap: 3px; }
.day-tag { font-size: 0.62rem; font-weight: 600; line-height: 1.2; padding: 1px 5px; border-radius: 6px; background: var(--surface-2); color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day-tag--feriado { background: color-mix(in srgb, var(--dot-red) 14%, var(--card)); color: var(--danger); }
.day-tag--ponto_facultativo { background: color-mix(in srgb, var(--dot-orange) 14%, var(--card)); color: var(--warn); }
.day-tag--comemorativa { background: color-mix(in srgb, var(--dot-green) 14%, var(--card)); color: var(--verde); }
.day-tag--pessoal { background: color-mix(in srgb, var(--dot-blue) 14%, var(--card)); color: var(--dot-blue); }
.day-num { font-size: 0.82rem; font-weight: 700; padding: 1px 5px; border-radius: 999px; }
.day-cell.today .day-num { background: var(--accent); color: var(--on-accent); }
.count-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 1.15rem; height: 1.15rem; padding: 0 4px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 0.62rem; font-weight: 700; }
.day-entry { display: flex; align-items: center; gap: 4px; font-size: 0.7rem; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day-entry span:last-child { overflow: hidden; text-overflow: ellipsis; }
.day-more { font-size: 0.68rem; color: var(--muted); }
.day-free { margin-top: auto; font-size: 0.66rem; color: var(--accent-bright); font-weight: 600; }

/* —— Week columns —— */
.week-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.week-day { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 12rem; }
.week-day.today { box-shadow: inset 0 0 0 2px var(--accent); }
.week-day__head { display: flex; justify-content: space-between; align-items: center; gap: 4px; font-weight: 700; font-size: 0.85rem; background: none; border: none; padding: 0; cursor: pointer; }
.week-day__marks { display: inline-flex; align-items: center; gap: 5px; }
.entry-chip { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font-size: 0.78rem; cursor: pointer; text-align: left; width: 100%; min-width: 0; overflow: hidden; }
.entry-chip > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-chip:hover { border-color: var(--accent); }
.entry-chip__time { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
/* With start and end times the name goes to its own line, so neither is cut in narrow columns. */
.entry-chip { flex-wrap: wrap; row-gap: 2px; }
.entry-chip > span:last-child { flex: 1 1 100%; }
.free-list { list-style: none; margin: 0; padding: 6px 8px; border: 1px dashed var(--border); border-radius: 8px; font-size: 0.74rem; color: var(--accent-bright); }
.free-list li + li { margin-top: 2px; }
.gaps { padding: 12px 14px; background: var(--surface-2); border: 1px dashed var(--border); border-radius: var(--radius-sm); font-size: 0.88rem; }
.gaps ul { margin: 6px 0 0; padding-left: 1.1rem; }

/* —— Tables: fit the width (cells wrap) instead of scrolling sideways —— */
.table-wrap { max-width: 100%; }
.table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
.table th, .table td { padding: 8px 9px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
.table thead th { background: var(--surface-2); font-size: 0.72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; position: sticky; top: 0; z-index: 1; overflow-wrap: normal; }
/* Percentage widths let the table shrink its columns instead of overflowing the page. */
.table .input:not(.input--time) { width: 100%; max-width: 100%; }
.table .input--fee { max-width: 6.5rem; }
.slot-add { flex-wrap: wrap; }
.cell-sub { margin-top: 5px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.cell-inline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.cell-grow .input--text { width: 100%; min-width: 0; }
.inline-field { display: flex; align-items: center; gap: 5px; font-size: 0.76rem; color: var(--muted); width: 100%; min-width: 0; }
.inline-field .input { font-size: 0.8rem; flex: 1 1 auto; min-width: 0; }
.cell-inline > * { min-width: 0; }
.table tbody tr:hover { background: var(--today-bg); }
.table tfoot th { background: var(--surface-2); }
.table .group-row th { background: var(--today-bg); font-size: 0.82rem; }
.table th.num { text-align: right; }
.table .actions { text-align: right; white-space: nowrap; }
.table .actions .btn + .btn { margin-left: 4px; }
.table .input { padding: 5px 7px; font-size: 0.84rem; border-width: 1px; }
.table .input--fee { text-align: right; }
.table .input--time { width: 6.2rem; }
.table .input--text { min-width: 0; width: 100%; }
.cell-name { min-width: 9rem; }
.cell-name .link { overflow-wrap: anywhere; }
.row-pending { background: color-mix(in srgb, var(--dot-yellow) 6%, transparent); }
.is-expanded { background: var(--today-bg); }
.detail-row > td { background: var(--bg); }
.slot-chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.slot-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 8px; border-radius: 999px; background: var(--today-bg); font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
.slot-chip button { border: none; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; font-weight: 700; }
.slot-add { display: inline-flex; gap: 4px; align-items: center; }
.slot-add .input { width: auto; }
.session-lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.session-lines li { display: grid; grid-template-columns: 5.5rem minmax(9rem, 1fr) minmax(8rem, auto) auto auto auto; gap: 10px; align-items: center; }
.plain-list { margin: 0; padding-left: 1.2rem; font-size: 0.88rem; }

/* —— Buttons and inputs —— */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 15px; border-radius: 999px; border: 1px solid transparent; font-weight: 600; font-size: 0.88rem; cursor: pointer; white-space: nowrap; }
.btn--small { padding: 5px 10px; font-size: 0.78rem; }
.btn--primary { background: var(--accent); color: var(--on-accent); }
.btn--primary:hover { background: var(--ink-soft); }
.btn--success { background: var(--dot-blue); color: #fff; }
.btn--danger { background: var(--dot-red); color: #fff; }
.btn--danger-soft { background: var(--danger-soft); color: var(--danger); }
.btn--secondary { background: var(--card); border-color: var(--border); }
.btn--secondary:hover, .btn--ghost:hover { background: var(--today-bg); }
.btn--ghost { background: none; color: var(--muted); }
.link { background: none; border: none; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-align: left; }
.link:hover { text-decoration: underline; }
.input { padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); min-width: 0; }
.input:focus { border-color: var(--accent); outline: 2px solid var(--accent-glow); }
.input--year { width: 6.5rem; }
.input--search { min-width: min(15rem, 100%); }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.check input { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
.period { display: flex; flex-wrap: wrap; gap: 6px; max-width: 100%; }
.period .input { flex: 1 1 8rem; }

/* —— Forms, dialogs, toasts —— */
.form { display: flex; flex-direction: column; gap: 14px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 12px; }
.form-grid[hidden] { display: none; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field__label { font-weight: 600; font-size: 0.85rem; }
.field__hint { font-size: 0.76rem; color: var(--muted); }
.form-actions { display: flex; gap: 8px; align-items: center; padding-top: 4px; }
.form-errors { background: var(--danger-soft); color: var(--danger); padding: 10px 14px; border-radius: var(--radius-sm); font-weight: 500; }
.dialog { width: min(44rem, calc(100vw - 2rem)); border: 1px solid var(--border); border-radius: var(--radius); padding: 0; background: var(--card); color: var(--text); box-shadow: 0 20px 50px rgb(0 0 0 / 0.3); }
.dialog--wide { width: min(64rem, calc(100vw - 2rem)); }
.dialog::backdrop { background: rgb(15 22 18 / 0.55); }
.dialog__header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.dialog__header h3 { font-size: 1.1rem; }
.dialog__body { padding: 18px; max-height: 78vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.dropzone { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 2.2rem 1rem; border: 3px dashed var(--border); border-radius: var(--radius); background: none; cursor: pointer; font-size: 1.05rem; }
.dropzone:hover { border-color: var(--accent); background: var(--today-bg); }
.toast { position: fixed; bottom: 1.5rem; right: 1.5rem; padding: 12px 18px; border-radius: 999px; font-weight: 600; box-shadow: var(--shadow); z-index: 10; }
.toast--success { background: var(--accent); color: var(--on-accent); }
.toast--danger { background: var(--dot-red); color: #fff; }

/* —— Charts —— */
.chart { margin: 0; }
.chart svg { width: 100%; height: auto; display: block; }
.chart__grid { stroke: var(--border); stroke-width: 1; }
.chart__axis { fill: var(--muted); font-size: 11px; }
.chart__bar--primary { fill: var(--accent-bright); background: var(--accent-bright); }
.chart__bar--success { fill: var(--dot-blue); background: var(--dot-blue); }
.chart__bar--danger { fill: var(--dot-red); background: var(--dot-red); }
.chart__bar--warning { fill: var(--dot-orange); background: var(--dot-orange); }
.chart__legend { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; font-size: 0.82rem; margin-top: 6px; }
.chart__key { display: inline-flex; align-items: center; gap: 6px; }
.chart__swatch { width: 0.75rem; height: 0.75rem; border-radius: 3px; display: inline-block; }

/* —— Shell: views beside the side panel (notebook and day information) —— */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
.shell > main { min-width: 0; }
.side-panel { display: none; }
.side-panel__inner { display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 1280px) {
  body.side-open .shell { grid-template-columns: minmax(0, 1fr) 21.5rem; }
  body.side-open .side-panel { display: block; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; scrollbar-width: thin; padding-right: 2px; }
}
@media (max-width: 1279.98px) {
  .side-panel { display: block; position: fixed; inset: 0 0 0 auto; width: min(24rem, 92vw); z-index: 30; background: var(--bg); border-left: 1px solid var(--border); box-shadow: -12px 0 40px rgb(0 0 0 / 0.18); padding: 14px; overflow-y: auto; transform: translateX(105%); visibility: hidden; transition: transform 0.2s ease, visibility 0.2s; }
  body.side-open .side-panel { transform: none; visibility: visible; }
}
@media (prefers-reduced-motion: reduce) { .side-panel { transition: none; } }
.side-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
.side-card__head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.side-card__head h2 { font-size: 0.98rem; font-weight: 700; color: var(--ink); margin-right: auto; }
.side-today { font-weight: 600; margin-bottom: 6px; }
.side-campaign { font-size: 0.8rem; padding: 6px 8px; border-radius: var(--radius-sm); background: var(--today-bg); margin: 6px 0; }
.side-numbers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 8px 0; }
.side-numbers div { background: var(--surface-2); border-radius: var(--radius-sm); padding: 6px 8px; }
.side-numbers dt { font-size: 0.66rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
.side-numbers dd { margin: 0; font-weight: 700; font-size: 0.86rem; }
.side-subtitle { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 10px 0 4px; }
.side-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 0.82rem; }
.side-list--events li { line-height: 1.35; }
.side-source { font-size: 0.7rem; color: var(--muted); margin-top: 8px; }
.side-source a, .side-list a { color: var(--accent); }
.date-badge { display: inline-block; font-size: 0.64rem; font-weight: 700; padding: 1px 6px; border-radius: 999px; vertical-align: 1px; }
.date-badge--red { background: color-mix(in srgb, var(--dot-red) 15%, var(--card)); color: var(--danger); }
.date-badge--orange { background: color-mix(in srgb, var(--dot-orange) 15%, var(--card)); color: var(--warn); }
.date-badge--green { background: color-mix(in srgb, var(--dot-green) 15%, var(--card)); color: var(--verde); }
.date-badge--blue { background: color-mix(in srgb, var(--dot-blue) 15%, var(--card)); color: var(--dot-blue); }
.quote-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.quote-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 4.6rem; gap: 8px; align-items: baseline; font-size: 0.84rem; }
.quote-row__name { display: flex; flex-direction: column; min-width: 0; }
.quote-row__name .muted { font-size: 0.7rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quote-row__price { font-weight: 700; font-variant-numeric: tabular-nums; }
.quote-row__chg { text-align: right; font-variant-numeric: tabular-nums; font-size: 0.78rem; font-weight: 600; }
.quote-row__chg.up { color: #15803d; }
.quote-row__chg.down { color: var(--danger); }
.quote-row__chg.flat { color: var(--muted); }
.notepad__status { font-size: 0.7rem; color: var(--muted); }
.side-quote { margin: 0; padding: 4px 0 0 12px; border-left: 3px solid var(--accent-bright); }
.side-quote p { white-space: pre-line; font-size: 0.9rem; line-height: 1.5; font-style: italic; }
.side-quote footer { margin-top: 6px; font-size: 0.72rem; color: var(--muted); }
.notepad__toolbar { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; }
.notepad__tool { min-width: 2rem; height: 2rem; padding: 0 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); cursor: pointer; font-size: 0.85rem; line-height: 1; }
.notepad__tool:hover { background: var(--today-bg); }
.notepad__tool[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.notepad__marker { background: #fde68a; color: #1a1f1c; padding: 0 3px; border-radius: 3px; }
.notepad__color { height: 2rem; border: 1px solid var(--border); border-radius: 8px; background: var(--card); font-size: 0.78rem; padding: 0 4px; max-width: 7.5rem; }
.notepad__area[contenteditable]:empty::before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; }
.notepad__area h3 { font-size: 1.02rem; font-weight: 700; margin: 0; line-height: 1.6rem; }
.notepad__area ul, .notepad__area ol { margin: 0; padding-left: 1.3rem; }
.notepad__area p, .notepad__area div { margin: 0; }
.notepad__area {
  width: 100%; min-height: 15rem; max-height: 60vh; overflow-y: auto; resize: vertical; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; overflow-wrap: anywhere;
  font: inherit; font-size: 0.9rem; line-height: 1.6rem; color: var(--text);
  background-color: color-mix(in srgb, var(--dot-yellow) 6%, var(--card));
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(1.6rem - 1px), color-mix(in srgb, var(--accent) 16%, transparent) calc(1.6rem - 1px), color-mix(in srgb, var(--accent) 16%, transparent) 1.6rem);
  background-attachment: local; background-position: 0 6px;
}
.notepad__area:focus { outline: 2px solid var(--accent-glow); border-color: var(--accent); }
.notepad__actions { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
.notepad__actions .muted { margin-right: auto; font-size: 0.7rem; }
.report-details summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 0.85rem; margin: 4px 0; }

/* —— Medium screens: the agenda keeps 7 columns; long names are cut —— */
@media (max-width: 1100px) {
  .table { font-size: 0.82rem; }
  .table th, .table td { padding: 7px 6px; }
}

/* —— Phones: table rows stack their cells (still one row per record, no cards) —— */
@media (max-width: 760px) {
  html { font-size: 16px; }
  .app { padding: 12px 12px 40px; }
  .table thead { display: none; }
  .table, .table tbody, .table tfoot, .table tr, .table td, .table th { display: block; width: 100%; }
  .table tr { padding: 8px 4px; border-bottom: 1px solid var(--border); }
  .table td, .table th { border: none; padding: 3px 4px; }
  .table td[data-label]::before { content: attr(data-label); display: block; font-size: 0.68rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .table td.num { text-align: left; }
  .table .actions { text-align: left; }
  .table .input--fee { width: 100%; text-align: left; }
  .week-grid { grid-template-columns: minmax(0, 1fr); }
  .week-day { min-height: 0; }
  .session-lines li { grid-template-columns: 1fr 1fr; }
  .day-tags { display: none; }
  .day-cell { min-height: 3.4rem; padding: 4px 3px; }
  .day-entry, .day-more { display: none; }
  .day-free { font-size: 0.6rem; }
  .nav-period__label { min-width: 0; font-size: 0.95rem; }
  .page-actions, .period { width: 100%; }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .input--search { min-width: 0; width: 100%; }
}

/* —— Vidro líquido (vidro-liquido.css da Agenda do André) ——
   The big panels and the fixed controls are frosted glass over the colored background; the cards

          db.close();

function confirmReplace(app, dataset, origin) {

  if (!confirm(message)) return false;
  app.commit(dataset);
  app.setUi({ patientId: null, view: 'painel' });
  toast('Dados substituídos.');
  return true;
}

/** Hidden file input: restores the backup .json the user picks (the notepad goes with it). */
function backupRestoreInput(app) {
  return h('input', {
    type: 'file',
    accept: '.json,application/json',
    class: 'visually-hidden',
    onChange: async (event) => {
      const [file] = event.target.files;
      event.target.value = '';
      if (!file) return;
      try {
        const { notepad: notes, savedAt: backupSavedAt, ...records } = JSON.parse(await file.text());
        const data = migrateDataset(records);
        if (!data) throw new Error('arquivo não é um backup deste sistema');
        if (!data.patients.length) throw new Error('o arquivo não tem nenhum paciente (backup vazio)');
        const savedAt = backupSavedAt ? ` (salvo em ${new Date(backupSavedAt).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })})` : '';
        if (confirmReplace(app, data, `Backup "${file.name}"${savedAt}`)) replaceNotepad(notes);
      } catch (error) {
        toast(`Backup inválido: ${error.message}.`, 'danger');
      }
    },
  });
}

function automaticBackup(app) {
  const { backup } = app;
  if (!backup) return null;
  const status = backup.status();
  const isEmpty = app.dataset.patients.length === 0;
  const choose = async () => {
    // Picking an existing backup file would overwrite it with this browser's empty records.
    if (isEmpty) return toast('Restaure o backup (ou importe a planilha) antes de ligar o backup automático.', 'danger');
    if (await backup.choose()) toast(backup.status().remembered ? 'Backup automático ligado.' : 'Backup ligado nesta visita; o navegador não guardou o arquivo para as próximas.');
  };
  const actions = {
    [BACKUP_STATE.OFF]: [button('Escolher arquivo do backup automático', { onClick: choose })],
    [BACKUP_STATE.ACTIVE]: [button('Trocar arquivo', { variant: 'secondary', onClick: choose }), button('Desligar', { variant: 'ghost', onClick: () => backup.stop() })],
    [BACKUP_STATE.NEEDS_PERMISSION]: [button('Reativar backup automático', { onClick: () => reconnectBackup(backup) }), button('Trocar arquivo', { variant: 'secondary', onClick: choose })],
    [BACKUP_STATE.ERROR]: [button('Escolher outro arquivo', { onClick: choose }), button('Desligar', { variant: 'ghost', onClick: () => backup.stop() })],
  }[status.state] ?? [];
  return h(
    'div',
    { class: 'stack stack--tight' },
    h('h4', {}, 'Backup automático'),
    h(
      'p',
      { class: 'muted' },
      'Escolha um arquivo dentro da pasta do OneDrive ou do Google Drive do computador. A partir daí, cada registro é gravado nele em segundos, e a nuvem guarda a cópia. Funciona no Chrome e no Edge. Ao abrir o sistema num dia novo, o navegador pode pedir um clique em "Reativar backup" para voltar a gravar.',
    ),
    backupStatusLine(status),
    isEmpty
      ? h('p', { class: 'muted' }, 'Este navegador ainda não tem dados: primeiro use "Restaurar backup" (abaixo) ou importe a planilha. Só depois ligue o backup automático, para o arquivo escolhido não ser gravado vazio.')
      : null,
    actions.length ? h('div', { class: 'page-actions' }, actions) : null,
  );
}

const { addDaysIso, addMonths, endOfMonth, startOfMonth } = modules["lib/dates.js"];

const APPOINTMENT_STATUSES = new Set([
  ATTENDANCE.PRESENT,
  ATTENDANCE.ABSENT,
  ATTENDANCE.CANCELLED_BY_PATIENT,
  ATTENDANCE.CANCELLED_BY_THERAPIST,
]);

/**
 * Share of the patient's appointments in the last 180 days that ended up charged
 * (attended or charged absence). Null when there is no recent history to learn from.
 */
function chargedShare(sessions, today) {
  const since = addDaysIso(today, -HISTORY_DAYS);
  const recent = sessions.filter((session) => session.date >= since && session.date <= today && APPOINTMENT_STATUSES.has(session.status));
  return recent.length ? recent.filter((session) => session.fee > 0).length / recent.length : null;
}

const isUpcoming = (entry) =>
  entry.kind === ENTRY_KIND.EXPECTED || (entry.session && entry.session.status === ATTENDANCE.SCHEDULED);

/**
 * Revenue forecast for the current month and the next ones, from the weekly schedules and the
 * sessions already booked. "Estimated" applies each patient's recent charged share; patients
 * without history count at 100%.
 */
function forecastMonths(dataset, indexes, today, monthsAhead = 3) {
  return Array.from({ length: monthsAhead }, (_, offset) => {
    const monthStart = addMonths(startOfMonth(today), offset);
    const from = offset === 0 ? today : monthStart;
    const entries = buildAgenda(dataset, indexes, { from, to: endOfMonth(monthStart) }, today).filter(isUpcoming);
    const byPatient = new Map();
    entries.forEach((entry) => {
      const patient = indexes.patientsById.get(entry.patientId);
      const fee = entry.session?.fee ?? patient?.defaultFee ?? 0;
      const row = byPatient.get(entry.patientId) ?? { patientId: entry.patientId, appointments: 0, gross: 0 };
      row.appointments += 1;
      row.gross = cents(row.gross + fee);
      byPatient.set(entry.patientId, row);
    });
    const rows = [...byPatient.values()].map((row) => {
      const share = chargedShare(indexes.sessionsByPatient.get(row.patientId) ?? [], today);
      return { ...row, share, estimated: cents(row.gross * (share ?? 1)) };
    });
    return {
      month: monthStart.slice(0, 7),
      from,
      appointments: rows.reduce((sum, row) => sum + row.appointments, 0),
      gross: cents(rows.reduce((sum, row) => sum + row.gross, 0)),
      estimated: cents(rows.reduce((sum, row) => sum + row.estimated, 0)),
      byPatient: rows,
    };
  });

      row.sessions += 1;
      row.sessionIds.push(session.id);
      row.amount = cents(row.amount + session.fee);
      if (session.date < row.oldest) row.oldest = session.date;

const { titleCase } = modules["lib/text.js"];
const { newPatient } = modules["domain/patients.js"];

  id: `g-${crypto.randomUUID()}`,
  patientId,
  date: deposit.date,
  amount: deposit.amount,
  bank: deposit.bank,
  reference: [deposit.reference, `extrato: ${deposit.client}`].filter(Boolean).join(' · '),

  payment.patientId === patientId && payment.date === deposit.date && payment.amount === deposit.amount;

/** Adds the deposits to the patient, skipping any already counted for that day and amount. */
function addDeposits(dataset, deposits, patientId) {
  const added = [];
  deposits.forEach((deposit) => {
    if (![...dataset.payments, ...added].some((payment) => sameDeposit(payment, deposit, patientId))) added.push(toPayment(deposit, patientId));
  });
  return [...dataset.payments, ...added];
}

/**
 * Attributes a deposit to a patient and remembers the client spelling, so every pending
 * deposit with the same spelling (and later imports) goes to the same patient. Deposits that
 * wait for a "same or another deposit?" answer are left for that decision.
 */
function assignDeposit(dataset, depositId, patientId) {
  const deposit = dataset.unassignedPayments.find((item) => item.id === depositId);
  if (!deposit) return dataset;
  const settled = dataset.unassignedPayments.filter((item) => item.id === depositId || (item.clientKey === deposit.clientKey && !item.suggestedPatientId));
  const settledIds = new Set(settled.map((item) => item.id));

    ...dataset,
    payments: addDeposits(dataset, settled, patientId),
    unassignedPayments: dataset.unassignedPayments.filter((item) => !settledIds.has(item.id)),

  };

 * suggested patient; "repetido" just discards the statement line (and is remembered).

  const deposit = dataset.unassignedPayments.find((item) => item.id === depositId);
  if (!deposit || (decision === DEPOSIT_DECISION.NEW && !deposit.suggestedPatientId)) return dataset;
  return {
    ...dataset,
    payments: decision === DEPOSIT_DECISION.NEW ? addDeposits(dataset, [deposit], deposit.suggestedPatientId) : dataset.payments,
    unassignedPayments: dataset.unassignedPayments.filter((item) => item.id !== depositId),

  [DATE_KIND.AWARENESS]: 'Data comemorativa',

/** Easter Sunday (Gregorian calendar, Meeus/Jones/Butcher algorithm). */
function easterSunday(year) {
  const a = year % 19;
  const b = Math.floor(year / 100);
  const c = year % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return iso(year, month, day);
}

/** n-th given weekday (0 = domingo) of a month, e.g. the 2nd Sunday of May. */
function nthWeekday(year, month, weekday, n) {

const FIXED_HOLIDAYS = [
  ['01-01', 'Confraternização Universal'],
  ['04-21', 'Tiradentes'],
  ['05-01', 'Dia do Trabalho'],
  ['09-07', 'Independência do Brasil'],
  ['10-12', 'Nossa Senhora Aparecida'],
  ['11-02', 'Finados'],
  ['11-15', 'Proclamação da República'],
  ['11-20', 'Dia Nacional de Zumbi e da Consciência Negra'],
  ['12-25', 'Natal'],

  ['08-27', 'Dia do Psicólogo'],
  ['09-10', 'Dia Mundial de Prevenção do Suicídio'],
  ['10-10', 'Dia Mundial da Saúde Mental'],
];

const MONTH_CAMPAIGNS = Object.freeze({
  1: 'Janeiro Branco · campanha de saúde mental (Lei 14.556/2023)',
  9: 'Setembro Amarelo · prevenção do suicídio',

function nationalDates(year) {
  const easter = easterSunday(year);
  return [
    ...FIXED_HOLIDAYS.map(([monthDay, name]) => entry(`${year}-${monthDay}`, name, DATE_KIND.HOLIDAY)),
    entry(addDaysIso(easter, -2), 'Paixão de Cristo', DATE_KIND.HOLIDAY),
    entry(addDaysIso(easter, -48), 'Carnaval', DATE_KIND.OPTIONAL),
    entry(addDaysIso(easter, -47), 'Carnaval', DATE_KIND.OPTIONAL),
    entry(addDaysIso(easter, -46), 'Quarta-feira de Cinzas', DATE_KIND.OPTIONAL, 'até as 14h'),
    entry(addDaysIso(easter, 60), 'Corpus Christi', DATE_KIND.OPTIONAL),
    entry(`${year}-12-24`, 'Véspera de Natal', DATE_KIND.OPTIONAL, 'a partir das 13h'),
    entry(`${year}-12-31`, 'Véspera de Ano Novo', DATE_KIND.OPTIONAL, 'a partir das 13h'),
    ...FIXED_AWARENESS.map(([monthDay, name]) => entry(`${year}-${monthDay}`, name, DATE_KIND.AWARENESS)),
    entry(nthWeekday(year, 5, 0, 2), 'Dia das Mães', DATE_KIND.AWARENESS),

/** The user's own dates: `date` is 'YYYY-MM-DD' (once) or '--MM-DD' (every year). */
function customDatesOf(year, customDates = []) {
  return customDates
    .map((item) => ({ ...item, date: item.date.startsWith('--') ? `${year}-${item.date.slice(2)}` : item.date }))
    .filter((item) => item.date.startsWith(String(year)))
    .map((item) => entry(item.date, item.name, DATE_KIND.CUSTOM, item.dayOff ? 'sem atendimento' : ''));
}

const cache = new Map();

/** Every known date of a year, sorted. */
function datesOfYear(year, customDates = []) {
  const key = `${year}|${JSON.stringify(customDates)}`;
  if (!cache.has(key)) {
    cache.set(key, [...nationalDates(year), ...customDatesOf(year, customDates)].sort((a, b) => a.date.localeCompare(b.date)));
  }
  return cache.get(key);

  return years.flatMap((year) => datesOfYear(year, customDates)).filter((item) => item.date >= from && item.date <= to);

modules["ui/charts.js"] = (() => {
const { h, svg } = modules["ui/dom.js"];
const WIDTH = 640;
const HEIGHT = 260;
const PADDING = { top: 16, right: 12, bottom: 34, left: 56 };
const TICKS = 4;

function niceMax(value) {
  if (value <= 0) return 1;
  const magnitude = 10 ** Math.floor(Math.log10(value));
  const step = [1, 2, 2.5, 5, 10].find((factor) => factor * magnitude * TICKS >= value) * magnitude;
  return step * TICKS;
}

/**
 * Bar chart rendered as inline SVG.
 * @param {{categories: string[], series: {label: string, tone: string, values: number[]}[],
 *          stacked?: boolean, formatValue?: (n: number) => string, title: string}} config
 */
function barChart({ categories, series, stacked = false, formatValue = String, title }) {
  const plotWidth = WIDTH - PADDING.left - PADDING.right;
  const plotHeight = HEIGHT - PADDING.top - PADDING.bottom;
  const totals = categories.map((_, index) =>
    stacked ? series.reduce((sum, serie) => sum + serie.values[index], 0) : Math.max(...series.map((serie) => serie.values[index])),
  );
  const maxValue = niceMax(Math.max(0, ...totals));
  const y = (value) => PADDING.top + plotHeight - (value / maxValue) * plotHeight;
  const band = plotWidth / categories.length;
  const barWidth = stacked ? band * 0.6 : (band * 0.7) / series.length;

  const grid = Array.from({ length: TICKS + 1 }, (_, tick) => {
    const value = (maxValue / TICKS) * tick;
    return [
      svg('line', { class: 'chart__grid', x1: PADDING.left, x2: WIDTH - PADDING.right, y1: y(value), y2: y(value) }),
      svg('text', { class: 'chart__axis', x: PADDING.left - 8, y: y(value) + 4, 'text-anchor': 'end' }, formatValue(value)),
    ];
  });

  const bars = categories.map((category, index) => {
    const bandStart = PADDING.left + band * index;
    let stackBase = 0;
    const rects = series.map((serie, serieIndex) => {
      const value = serie.values[index];
      const x = stacked ? bandStart + (band - barWidth) / 2 : bandStart + band * 0.15 + barWidth * serieIndex;
      const top = y(stackBase + value);
      const height = y(stackBase) - top;
      if (stacked) stackBase += value;
      return svg(
        'rect',
        { class: `chart__bar chart__bar--${serie.tone}`, x, y: top, width: Math.max(barWidth - 2, 1), height: Math.max(height, 0), rx: 3 },
        svg('title', {}, `${category} · ${serie.label}: ${formatValue(value)}`),
      );
    });
    const label = svg('text', { class: 'chart__axis', x: bandStart + band / 2, y: HEIGHT - 12, 'text-anchor': 'middle' }, category);
    return [rects, label];
  });

  return h(
    'figure',
    { class: 'chart' },
    svg('svg', { viewBox: `0 0 ${WIDTH} ${HEIGHT}`, role: 'img', 'aria-label': title }, grid, bars),
    h(
      'figcaption',
      { class: 'chart__legend' },
      series.map((serie) => h('span', { class: 'chart__key' }, h('i', { class: `chart__swatch chart__bar--${serie.tone}` }), serie.label)),
    ),
  );
}

return { barChart };
})();

modules["infra/live-info.js"] = (() => {
// Live public data for the side panel. Every source is optional: on failure the panel shows
// the last values received (with their time) or says the source is unavailable.

const TIMEOUT_MS = 8000;
const CACHE_KEY = 'controle-clinico/info-cache';

const SOURCES = Object.freeze({
  currencies: { name: 'AwesomeAPI', url: 'https://economia.awesomeapi.com.br' },
  stocks: { name: 'brapi.dev', url: 'https://brapi.dev' },
  onThisDay: { name: 'Wikipédia (conteúdo colaborativo)', url: 'https://pt.wikipedia.org' },
});

const CURRENCY_PAIRS = [
  ['USDBRL', 'Dólar', 'USD/BRL'],
  ['EURBRL', 'Euro', 'EUR/BRL'],
  ['GBPBRL', 'Libra', 'GBP/BRL'],
  ['EURUSD', 'Euro/Dólar', 'EUR/USD'],
];
// brapi.dev answers these tickers without a token; others (and indices) need a free token.
const FREE_TICKERS = ['PETR4', 'VALE3', 'ITUB4', 'MGLU3'];
const TOKEN_TICKERS = ['^BVSP', 'BBAS3', 'BBDC4', 'WEGE3'];

async function getJson(url, headers = {}) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
  try {
    const response = await fetch(url, { headers, signal: controller.signal, cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return await response.json();
  } finally {
    clearTimeout(timer);
  }
}

function readCache() {
  try {
    return JSON.parse(localStorage.getItem(CACHE_KEY)) ?? {};
  } catch {
    return {};
  }
}

function writeCache(key, data) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ ...readCache(), [key]: { at: new Date().toISOString(), data } }));
  } catch {
    // Without storage the panel simply refetches next time.
  }
}

/**
 * Runs `load`; on success caches and returns `{ data, at, live: true }`, otherwise the cached
 * value (`live: false`) or `{ data: null, error }`.
 */
async function withCache(key, load) {
  try {
    const data = await load();
    writeCache(key, data);
    return { data, at: new Date().toISOString(), live: true };
  } catch (error) {
    const cached = readCache()[key];
    return cached ? { ...cached, live: false, error: error.message } : { data: null, live: false, error: error.message };
  }
}

const toNumber = (value) => (value === null || value === undefined || value === '' ? null : Number(value));

const fetchCurrencies = () =>
  withCache('currencies', async () => {
    const json = await getJson(`https://economia.awesomeapi.com.br/json/last/${CURRENCY_PAIRS.map(([code]) => `${code.slice(0, 3)}-${code.slice(3)}`).join(',')}`);
    const rows = CURRENCY_PAIRS.filter(([code]) => json[code]).map(([code, label, pair]) => ({
      pair,
      label,
      bid: toNumber(json[code].bid),
      ask: toNumber(json[code].ask),
      changePct: toNumber(json[code].pctChange),
      quotedAt: json[code].create_date ?? null,
    }));
    if (!rows.length) throw new Error('resposta sem cotações');
    return rows;
  });

async function fetchTicker(symbol, token) {
  const query = token ? `?token=${encodeURIComponent(token)}` : '';
  const json = await getJson(`https://brapi.dev/api/quote/${encodeURIComponent(symbol)}${query}`);
  const quote = json.results?.[0];
  if (!quote || quote.regularMarketPrice === undefined) throw new Error(`sem cotação de ${symbol}`);
  return {
    symbol: quote.symbol,
    name: quote.shortName ?? quote.longName ?? quote.symbol,
    price: toNumber(quote.regularMarketPrice),
    changePct: toNumber(quote.regularMarketChangePercent),
    quotedAt: quote.regularMarketTime ?? null,
  };
}

/** One request per ticker: the free plan of brapi.dev answers a single ticker per request. */
const fetchStocks = (token = '') =>
  withCache(token ? 'stocks-token' : 'stocks', async () => {
    const symbols = token ? [...TOKEN_TICKERS, ...FREE_TICKERS] : FREE_TICKERS;
    const results = await Promise.allSettled(symbols.map((symbol) => fetchTicker(symbol, token)));
    const rows = results.filter((result) => result.status === 'fulfilled').map((result) => result.value);
    if (!rows.length) throw new Error(results.find((result) => result.status === 'rejected')?.reason?.message ?? 'sem cotações');
    return rows;
  });

/** "Neste dia" from the Portuguese Wikipedia (selected events). */
const fetchOnThisDay = (date) =>
  withCache(`onthisday-${date.slice(5)}`, async () => {
    const [month, day] = [date.slice(5, 7), date.slice(8, 10)];
    const json = await getJson(`https://api.wikimedia.org/feed/v1/wikipedia/pt/onthisday/selected/${month}/${day}`, {
      'Api-User-Agent': 'ControleClinico/1.0 (aplicativo local de consultório)',
    });
    const events = (json.selected ?? []).map((event) => ({
      year: event.year,
      text: event.text,
      url: event.pages?.[0]?.content_urls?.desktop?.page ?? null,
    }));
    if (!events.length) throw new Error('sem eventos');
    return events;
  });

return { SOURCES, fetchCurrencies, fetchStocks, fetchOnThisDay };
})();
modules["ui/side-panel.js"] = (() => {
const { DATE_KIND, DATE_KIND_LABELS, datesOn, MONTH_CAMPAIGNS, upcomingDates } = modules["domain/calendar-dates.js"];

const DATE_TONE = {

  const year = Number(today.slice(0, 4));
  const upcoming = upcomingDates(today, UPCOMING_DAYS, customDates).filter((item) => item.date > today).slice(0, MAX_UPCOMING);

    { id: 'sideToday' },

    h('p', { class: 'side-source' }, 'Feriados nacionais por lei; pontos facultativos conforme a portaria anual do Ministério da Gestão (valem para órgãos federais). Feriados do seu estado e da sua cidade: cadastre em Configurações.'),

function updatedLabel(result, source) {

const changeClass = (value) => (value > 0 ? 'up' : value < 0 ? 'down' : 'flat');

const currenciesCard = () =>
  liveCard({
    title: 'Câmbio',

/**

function createSidePanel(app) {

modules["infra/offline-cache.js"] = (() => {
/**
 * Registers the service worker that keeps the hosted app usable offline. Only the GitHub Pages
 * build ships one and names it in <meta name="service-worker">; the single file opened from
 * disk has none and keeps working as before.
 */
function registerOfflineCache() {
  const script = document.querySelector('meta[name="service-worker"]')?.content;
  if (!script || !('serviceWorker' in navigator) || !window.isSecureContext) return;
  navigator.serviceWorker.register(script).catch((error) => console.warn('Modo offline indisponível:', error));
}

return { registerOfflineCache };
})();
modules["main.js"] = (() => {
const { createApp } = modules["app.js"];

const { emptyDataset } = modules["domain/settings.js"];

const { registerOfflineCache } = modules["infra/offline-cache.js"];

  { id: 'consolidado', label: 'Fechamento do mês', render: renderMonthly },

  { id: 'indicadores', label: 'Indicadores', render: renderOverview },

const SIDE_KEY = 'controle-clinico/painel-lateral';
